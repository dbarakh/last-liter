<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Последний литр · таблица рекордов</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9B%BD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#f7ead8;--dim:rgba(247,234,216,.72);--accent:#ffb347;--bg:#1a1016;--panel:rgba(20,12,16,.62);--line:rgba(247,234,216,.18);}
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif;}
  .bg{position:fixed;inset:-20px;background:url(assets/hero.jpg) center/cover no-repeat;filter:blur(12px) brightness(.28);z-index:0;}
  .wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:clamp(20px,5vh,48px) clamp(16px,5vw,40px) 60px;}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  h1{margin:0;font-weight:900;font-size:clamp(28px,5vw,44px);line-height:1;}
  .sub{margin:6px 0 0;color:var(--dim);font-size:14px;}
  .back{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;}
  .tabs{display:flex;gap:8px;margin:0 0 14px;}
  .tab{background:none;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:8px 14px;font:500 13px Rubik,system-ui;cursor:pointer;}
  .tab.on{background:var(--accent);color:#2b1608;border-color:var(--accent);}
  ol{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  li{display:grid;grid-template-columns:44px 1fr auto auto auto;gap:12px;align-items:center;padding:10px 16px;font-size:clamp(14px,1.4vw,17px);}
  li:nth-child(odd){background:rgba(255,255,255,.04);}
  li span:first-child{color:var(--dim);font-weight:700;} li:nth-child(1) span:first-child{color:var(--accent);}
  li b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  li i{font-style:normal;color:var(--dim);font-size:.85em;} li small{color:rgba(247,234,216,.4);font-size:.8em;font-variant-numeric:tabular-nums;}
  li em{font-style:normal;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;}
  .note{color:var(--dim);font-size:13px;margin-top:14px;}
  @media (max-width:560px){ li{grid-template-columns:34px 1fr auto auto;padding:9px 12px;} li small{display:none;} }
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <div class="head">
    <div><h1>Таблица рекордов</h1><p class="sub" id="sub">загружаю…</p></div>
    <a class="back" href="./">← На главную</a>
  </div>
  <div class="tabs"><button class="tab on" data-v="">Все</button><button class="tab" data-v="car">Авто</button><button class="tab" data-v="cart">Телега</button></div>
  <ol id="list"></ol>
  <p class="note">Километры записываются на финальном экране игры. Показаны лучшие 200 заездов.</p>
</div>
<script>
  const LB_URL = 'https://hflezrtvwasxiexjhvjh.supabase.co', LB_KEY = 'sb_publishable_kmCZJfe36vH7-fKh45jPIQ_Rg9HYieY';
  const list = document.getElementById('list'), sub = document.getElementById('sub');
  const fmtDate = s => { const d = new Date(s); return isNaN(d) ? '' : d.toLocaleDateString('ru-RU', {day:'numeric', month:'short'}) + ', ' + d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}); };
  const load = v => {
    sub.textContent = 'загружаю…'; list.innerHTML = '';
    const q = 'scores?select=name,km,vehicle,created_at&order=km.desc&limit=200' + (v ? '&vehicle=eq.' + v : '');
    fetch(LB_URL + '/rest/v1/' + q, {headers:{apikey:LB_KEY, Authorization:'Bearer ' + LB_KEY}}).then(r => r.ok ? r.json() : Promise.reject()).then(rows => {
      sub.textContent = rows.length ? rows.length + ' ' + (rows.length % 10 === 1 && rows.length % 100 !== 11 ? 'заезд' : rows.length % 10 >= 2 && rows.length % 10 <= 4 && (rows.length % 100 < 10 || rows.length % 100 >= 20) ? 'заезда' : 'заездов') : 'пока пусто';
      rows.forEach((r, i) => { const li = document.createElement('li'); li.innerHTML = '<span>' + (i + 1) + '</span><b></b><i>' + (r.vehicle === 'cart' ? 'телега' : 'авто') + '</i><small>' + fmtDate(r.created_at) + '</small><em>' + (+r.km).toFixed(2) + ' км</em>'; li.querySelector('b').textContent = r.name; list.appendChild(li); });
    }).catch(() => { sub.textContent = 'таблица недоступна'; });
  };
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b)); load(b.dataset.v); }));
  load('');
</script>
</body>
</html>
